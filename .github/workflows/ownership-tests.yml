name: Ownership tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  native-ownership:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve unrelated sources and release surfaces
        run: python3 -B tests/ownership/preserve.py
      - name: Full SDK engine-boundary ASan and UBSan regression
        run: python3 -B tests/ownership/run.py --output "$RUNNER_TEMP/ownership-fixed"
      - name: Verify the identical harness rejects the immutable baseline
        run: |
          mkdir "$RUNNER_TEMP/ownership-baseline"
          git archive edb67437c40c510450893291dbcf606846c091f1 | tar -x -C "$RUNNER_TEMP/ownership-baseline"
          python3 -B tests/ownership/run.py --source "$RUNNER_TEMP/ownership-baseline" --output "$RUNNER_TEMP/ownership-original-build" --expect-baseline-fail
      - name: Existing lifecycle tests with local synthetic fixtures
        run: python3 -B -m unittest discover -s .github/tests -p 'test_*.py'
